<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">

<title>Gram Wallet</title><style>:root{color-scheme:dark;--u:min(1vw,4.6px);--bg:#0c0c0c;--panel:#181818;--btn:#222;--muted:#8d8d92;--blue:#3d9bff;--green:#3ddc84;--red:#ff4d4d}

.big{width:calc(var(--u)*26);height:calc(var(--u)*26);margin:0 auto calc(var(--u)*2)}.big svg{width:100%;height:100%}
