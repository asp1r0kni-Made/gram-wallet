<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b0c10"><title>Gram Wallet</title>
<link rel="stylesheet" href="style.css"></head><body>
<div id="app">
 <div class="bg"><i></i><i></i><i></i></div>
 <div class="top">
  <div class="tabs glass" id="tabs"><div id="tt"><i class="pill" id="pill"></i><button class="tab on">Кошелёк</button><button class="tab">Маркет</button><button class="tab">Обзор</button></div></div>
  <button class="ava glass" id="ava"><span id="ini">GW</span></button>
 </div>
 <div class="pages" id="pages"><div class="track" id="track">
  <section class="pg on" id="p0">
   <div class="cards" id="cards">
    <div class="card" id="c1">
     <div class="cbg"></div><canvas id="dust"></canvas>
     <svg class="mcard" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="3"/><path d="M3 10h18"/></svg>
     <button class="bal" id="balb"><span id="bal">0</span></button>
     <button class="cname" id="cnm"><span>Gram Wallet</span><svg viewBox="0 0 30 30" fill="none" stroke="rgba(255,255,255,.85)" stroke-width="2.6" stroke-linecap="round"><rect x="3" y="3" width="9" height="9" rx="2"/><rect x="18" y="3" width="9" height="9" rx="2"/><rect x="3" y="18" width="9" height="9" rx="2"/><path d="M19 19h1M25 19h1M19 25h1M25 25h1M22 22h1"/></svg></button>
     <button class="eye glass" id="eye" aria-label="Скрыть баланс"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-6.500 10-6.500S22 12 22 12s-3.500 6.500-10 6.500S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path class="sl" d="M4 4l16 16"/></svg></button>
    </div>
    <div class="card two" id="c2"><div class="bal" style="font-size:calc(var(--u)*11)"><span id="stk">0</span></div><div class="cname"><span>В стейкинге · APY 13.91%</span></div></div>
   </div>
   <div class="acts">
    <button class="act" onclick="deposit()"><i class="glass"><svg viewBox="0 0 34 34"><path d="M17 5v24M5 17h24"/></svg></i>Пополнить</button>
    <button class="act" onclick="sendScr()"><i class="glass"><svg viewBox="0 0 34 34"><path d="M17 29V6M7 15l10-10 10 10"/></svg></i>Отправить</button>
    <button class="act" onclick="trade()"><i class="glass"><svg viewBox="0 0 34 34"><path d="M5 12h24M23 6l6 6M29 22H5M11 28l-6-6"/></svg></i>Торговля</button>
    <button class="act" onclick="stakeScr()"><i class="glass"><svg viewBox="0 0 34 34"><ellipse cx="17" cy="10" rx="9" ry="5"/><path d="M8 10v4c0 3 4 5 9 5s9-2 9-5v-4M8 19v4c0 3 4 5 9 5s9-2 9-5v-4"/></svg></i>Стейкинг</button>
   </div>
   <div class="panel glass" style="overflow:hidden">
    <button class="row" onclick="tokScr('gram')"><div class="ico" id="ico-gram"></div><div class="mid"><div class="nm">Gram <span class="badge apy">APY 13.91%</span></div><div class="sub"><span id="gp"></span><b class="dn">−4.25%</b></div></div><div class="rt amt"><div id="gv">0 GRAM</div><div id="gr">0 ₽</div></div></button>
    <button class="row" onclick="tokScr('usdt')"><div class="ico" id="ico-usdt"></div><div class="mid"><div class="nm">Tether USD <span class="badge">TON</span></div><div class="sub" id="up"></div></div><div class="rt amt"><div id="uv">0 USD₮</div><div id="ur">0 ₽</div></div></button>
   </div>
   <div class="panel glass feed"><h3>Лента</h3><div id="feed"></div></div>
  </section>
  <section class="pg" id="p1"></section>
  <section class="pg" id="p2"></section>
 </div></div>
 <div class="bar">
  <label class="search glass"><svg viewBox="0 0 30 30"><circle cx="13" cy="13" r="8"/><path d="M19 19l7 7"/></svg><input id="q" placeholder="Искать или спросить"></label>
  <button class="plus glass" onclick="deposit()"><svg viewBox="0 0 34 34"><path d="M17 6v22M6 17h22"/></svg></button>
 </div>
 <div id="auth">
  <div class="logo" id="alogo"></div><h1>Gram Wallet</h1><p class="lead">Войдите или создайте кошелёк</p>
  <div class="seg glass"><i class="pill" id="apill"></i><button class="on" data-m="login">Вход</button><button data-m="register">Регистрация</button></div>
  <input class="fld" id="u" placeholder="Логин" autocomplete="username" autocapitalize="none">
  <input class="fld" id="p" type="password" placeholder="Пароль" autocomplete="current-password">
  <button class="pri" id="go">Войти</button><div class="msg" id="am"></div>
  <div class="srv" id="srv"></div>
 </div>
 <div class="toast glass" id="toast"></div>
</div>
<script src="config.js"></script><script defer src="pako.min.js"></script><script defer src="lottie.min.js"></script><script defer src="app.js"></script><script defer src="extra.js"></script><script defer src="pin.js"></script>
</body></html>
