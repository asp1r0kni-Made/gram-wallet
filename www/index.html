<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0c0c">
<title>Gram Wallet</title><style>
:root{color-scheme:dark;--bg:#0c0c0c;--panel:#181818;--btn:#222;--muted:#8d8d92;--blue:#3d9bff;--green:#3ddc84;--red:#ff4d4d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
#app{position:relative;max-width:460px;height:100%;margin:0 auto;background:var(--bg);overflow:hidden;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.scroll{flex:1;overflow-y:auto;padding:14px 0 130px;scrollbar-width:none}.scroll::-webkit-scrollbar{display:none}
.top{display:flex;align-items:center;gap:10px;padding:8px 14px 0}
.tabs{flex:1;display:flex;background:#141414;border:1px solid #262626;border-radius:30px;padding:6px;overflow:hidden}
.tab{flex:1;padding:11px 0;border-radius:24px;font-size:17px;font-weight:500;color:#a5a5aa;white-space:nowrap}
.tab.on{background:#16283a;color:var(--blue)}
.ava{width:50px;height:50px;border-radius:50%;padding:5px;background:#141414;border:1px solid #262626;flex:none}
.ava span{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:linear-gradient(135deg,#ffb347,#ff8c1a);font-weight:800;font-size:16px}
.cards{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:20px 14px 0;scrollbar-width:none}.cards::-webkit-scrollbar{display:none}
.card{position:relative;flex:none;width:calc(100% - 20px);height:min(52vw,250px);border-radius:34px;scroll-snap-align:center;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 60% 75%,#35a6ff 0,#1f86f5 35%,#1678ef 70%),linear-gradient(135deg,#55c4ff,#1578ee)}
.card.two{background:linear-gradient(135deg,#1c5fb8,#0e3f86)}
.card::before{content:"";position:absolute;top:-20%;left:-40%;width:60%;height:140%;background:radial-gradient(circle,rgba(255,255,255,.28),transparent 62%);animation:glow 7s ease-in-out infinite alternate;pointer-events:none}
@keyframes glow{to{transform:translateX(260%)}}
.st{position:absolute;color:#fff;pointer-events:none;animation:tw 3s ease-in-out infinite,dr 9s ease-in-out infinite;opacity:.2}
@keyframes tw{0%,100%{opacity:.15;scale:.6}50%{opacity:1;scale:1.25}}
@keyframes dr{0%,100%{translate:0 0}50%{translate:10px -14px}}
.bal,.cname{position:relative;z-index:1}
.bal{font-size:min(24vw,104px);font-weight:700;line-height:1;display:flex;align-items:baseline;gap:8px;margin-top:-18px}.bal small{font-size:.55em}
.cname{position:absolute;bottom:18px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:10px;font-size:22px;font-weight:500;color:rgba(255,255,255,.75)}
.acts{display:flex;justify-content:space-around;padding:26px 8px 6px}
.act{display:flex;flex-direction:column;align-items:center;gap:10px;font-size:13px;width:25%}
.act i{width:74px;height:74px;border-radius:50%;background:var(--btn);display:grid;place-items:center;transition:transform .12s}.act:active i{transform:scale(.92)}
.act svg{width:34px;height:34px;stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.panel{background:var(--panel);border-radius:34px;margin:22px 0 0}.assets{padding:8px 0}
.row{display:flex;align-items:center;gap:14px;padding:14px 20px;width:100%;text-align:left}
.ico{position:relative;width:66px;height:66px;flex:none}.ico svg,.ico>div{width:100%;height:100%}
.mid{flex:1;min-width:0}.nm{display:flex;align-items:center;gap:8px;font-size:23px;font-weight:600}
.badge{font-size:16px;font-weight:500;padding:3px 10px;border-radius:16px;background:#232323;color:#999}.badge.apy{background:#16301f;color:var(--green)}
.sub{margin-top:4px;font-size:20px;color:var(--muted)}.sub b{font-weight:500;color:var(--red);margin-left:8px}
.rt{text-align:right;font-size:23px;font-weight:600}.rt div+div{margin-top:4px;font-size:20px;font-weight:400;color:var(--muted)}
.feed{padding:26px 24px 36px;min-height:260px}.feed h3{margin:0;font-size:26px;font-weight:500;color:var(--blue)}
.empty{text-align:center;margin-top:70px}.empty b{font-size:25px;font-weight:600}.empty p{margin:14px 0 0;font-size:22px;line-height:1.3;color:var(--muted)}
.bar{position:absolute;left:0;right:0;bottom:0;padding:10px 14px calc(22px + env(safe-area-inset-bottom,0px));display:flex;gap:12px;background:linear-gradient(transparent,var(--bg) 35%)}
.search{flex:1;height:64px;border-radius:32px;background:#171717;border:1px solid #2a2a2a;display:flex;align-items:center;gap:14px;padding:0 22px}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:#fff;font:inherit;font-size:21px}.search input::placeholder{color:var(--muted)}
.search svg,.plus svg{width:30px;height:30px;stroke:#aaa;fill:none;stroke-width:2.4;stroke-linecap:round}
.plus{width:64px;height:64px;border-radius:50%;background:#171717;border:1px solid #2a2a2a;display:grid;place-items:center;flex:none}.plus svg{stroke:#ccc;width:34px;height:34px}
.dim{position:absolute;inset:0;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .2s;z-index:5}.dim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:6;background:#1a1a1a;border-radius:30px 30px 0 0;padding:14px 22px calc(28px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .25s}.sheet.on{transform:none}
.grab{width:44px;height:5px;border-radius:3px;background:#444;margin:0 auto 18px}
.sheet h2{margin:0 0 14px;font-size:24px}.sheet p{color:var(--muted);font-size:17px;line-height:1.4;margin:0 0 14px}
.big{width:120px;height:120px;margin:0 auto 10px}.big svg{width:100%;height:100%}
.fld{width:100%;background:#262626;border:0;border-radius:16px;padding:16px;color:#fff;font:inherit;font-size:18px;margin-bottom:12px;outline:0}
.pri{display:block;width:100%;padding:17px;border-radius:18px;background:#1f86f5;font-size:18px;font-weight:600;text-align:center;color:#fff;text-decoration:none;margin-bottom:10px}.pri.gr{background:#2a2a2a}
.addr{background:#262626;border-radius:16px;padding:16px;font-family:ui-monospace,monospace;font-size:14px;word-break:break-all;margin-bottom:14px}
.msg{min-height:20px;margin-top:6px;font-size:15px;color:var(--red);text-align:center}
.toast{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));left:50%;transform:translate(-50%,-90px);background:#2a2a2a;padding:12px 20px;border-radius:20px;font-size:15px;z-index:9;transition:transform .25s}.toast.on{transform:translate(-50%,0)}
.ph{padding:80px 30px;text-align:center;color:var(--muted);font-size:20px}
#auth{position:absolute;inset:0;z-index:8;background:var(--bg);padding:calc(40px + env(safe-area-inset-top,0px)) 24px 24px;display:none;flex-direction:column;justify-content:center}
#auth.on{display:flex}#auth h1{text-align:center;margin:12px 0 4px;font-size:30px}#auth .lead{text-align:center;color:var(--muted);margin:0 0 26px}
.logo{width:96px;height:96px;margin:0 auto}
.seg{display:flex;background:#141414;border:1px solid #262626;border-radius:26px;padding:5px;margin-bottom:18px}.seg button{flex:1;padding:11px;border-radius:22px;color:#a5a5aa;font-weight:500}.seg button.on{background:#16283a;color:var(--blue)}
@media(min-width:520px){body{display:grid;place-items:center}#app{height:min(900px,100%);border-radius:36px;border:1px solid #222}}

#adm{position:absolute;inset:0;z-index:7;background:var(--bg);overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 40px;display:none}#adm.on{display:block}
#adm h1{font-size:26px;margin:10px 0 4px}#adm .lead{color:var(--muted);margin:0 0 18px;font-size:15px}.back{color:var(--blue);font-size:17px}
.slot{background:var(--panel);border-radius:26px;padding:18px;margin-bottom:14px}.slot h3{margin:0 0 12px;font-size:18px}
.pv{width:110px;height:110px;margin:0 auto 12px;background:#101010;border-radius:20px;display:grid;place-items:center;color:var(--muted);font-size:13px;overflow:hidden}.pv div,.pv svg{width:100%;height:100%}
.slot input[type=file]{width:100%;margin-bottom:10px;color:var(--muted)}
</style><script src="pako.min.js"></script><script src="lottie.min.js"></script></head><body>
<div id="app">
 <div class="top"><div class="tabs" id="tabs"><button class="tab on" data-t="wallet">Кошелёк</button><button class="tab" data-t="market">Маркет</button><button class="tab" data-t="browse">Обзор</button></div>
  <button class="ava" id="ava"><span id="ini">GW</span></button></div>
 <div class="scroll" id="scroll">
  <section id="wallet">
   <div class="cards">
    <div class="card" id="c1"><div class="bal"><span>0</span><small>₽</small></div>
     <div class="cname">Gram Wallet <svg width="30" height="30" viewBox="0 0 30 30" fill="none" stroke="rgba(255,255,255,.8)" stroke-width="2.6" stroke-linecap="round"><rect x="3" y="3" width="9" height="9" rx="2"/><rect x="18" y="3" width="9" height="9" rx="2"/><rect x="3" y="18" width="9" height="9" rx="2"/><path d="M19 19h1M25 19h1M19 25h1M25 25h1M22 22h1"/></svg></div></div>
    <div class="card two"><div class="bal" style="font-size:54px;margin-top:-10px"><span>13.91%</span></div><div class="cname">Стейкинг Gram</div></div>
   </div>
   <div class="acts">
    <button class="act" data-a="deposit"><i><svg viewBox="0 0 34 34"><path d="M17 5v24M5 17h24"/></svg></i>Пополнить</button>
    <button class="act" data-a="send"><i><svg viewBox="0 0 34 34"><path d="M17 29V6M7 15l10-10 10 10"/></svg></i>Отправить</button>
    <button class="act" data-a="trade"><i><svg viewBox="0 0 34 34"><path d="M5 12h24M23 6l6 6M29 22H5M11 28l-6-6"/></svg></i>Торговля</button>
    <button class="act" data-a="stake"><i><svg viewBox="0 0 34 34"><ellipse cx="17" cy="10" rx="9" ry="5"/><path d="M8 10v4c0 3 4 5 9 5s9-2 9-5v-4M8 19v4c0 3 4 5 9 5s9-2 9-5v-4"/></svg></i>Стейкинг</button>
   </div>
   <div class="panel assets">
    <button class="row" data-tok="gram"><div class="ico" id="ico-gram"><svg viewBox="0 0 66 66"><circle cx="33" cy="33" r="33" fill="#2f95f5"/><path d="M18 26l5-6h20l5 6-15 21z" fill="#fff"/><path d="M33 24l2.4 5.6L41 32l-5.6 2.4L33 40l-2.4-5.6L25 32l5.6-2.4z" fill="#2f95f5"/></svg></div><div class="mid"><div class="nm">Gram <span class="badge apy">APY 13.91%</span></div><div class="sub">82.86 ₽<b>−4.25%</b></div></div><div class="rt"><div>0 GRAM</div><div>0 ₽</div></div></button>
    <button class="row" data-tok="usdt"><div class="ico" id="ico-usdt"><svg viewBox="0 0 66 66"><circle cx="33" cy="33" r="33" fill="#119f8a"/><path d="M17 22l4-5h24l4 5-16 22z" fill="#fff"/><path d="M24 25h18M33 25v12M27 30c0 2 12 2 12 0" stroke="#119f8a" stroke-width="2.6" fill="none" stroke-linecap="round"/><circle cx="50" cy="50" r="11" fill="#1e88e5" stroke="#181818" stroke-width="3"/><path d="M45 46h10l-5 9z" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg></div><div class="mid"><div class="nm">Tether USD <span class="badge">TON</span></div><div class="sub">81.87 ₽</div></div><div class="rt"><div>0 USD₮</div><div>0 ₽</div></div></button>
   </div>
   <div class="panel feed"><h3>Лента</h3><div class="empty"><b>Нет активности</b><p>История операций в этом кошельке пока отсутствует.</p></div></div>
  </section>
  <section id="market" hidden><div class="ph">Маркет скоро откроется</div></section>
  <section id="browse" hidden><div class="ph">Обзор скоро появится</div></section>
 </div>
 <div class="bar"><label class="search"><svg viewBox="0 0 30 30"><circle cx="13" cy="13" r="8"/><path d="M19 19l7 7"/></svg><input id="q" placeholder="Искать или спросить"></label>
  <button class="plus" id="plus"><svg viewBox="0 0 34 34"><path d="M17 6v22M6 17h22"/></svg></button></div>
 <div id="auth">
  <div class="logo"><svg viewBox="0 0 66 66"><circle cx="33" cy="33" r="33" fill="#2f95f5"/><path d="M18 26l5-6h20l5 6-15 21z" fill="#fff"/><path d="M33 24l2.4 5.6L41 32l-5.6 2.4L33 40l-2.4-5.6L25 32l5.6-2.4z" fill="#2f95f5"/></svg></div><h1>Gram Wallet</h1><p class="lead">Войдите или создайте кошелёк</p>
  <div class="seg"><button class="on" data-m="login">Вход</button><button data-m="register">Регистрация</button></div>
  <input class="fld" id="u" placeholder="Логин" autocomplete="username" autocapitalize="none">
  <input class="fld" id="p" type="password" placeholder="Пароль" autocomplete="current-password">
  <button class="pri" id="go">Войти</button><div class="msg" id="am"></div>
 </div>
 <div id="adm"></div><div class="dim" id="dim"></div><div class="sheet" id="sheet"><div class="grab"></div><div id="sbody"></div></div><div class="toast" id="toast"></div>
</div>
<script src="index.js"></script></body></html>
